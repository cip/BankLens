name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-save --no-package-lock playwright@1.55.1
      - run: npx playwright install --with-deps chrome
      - run: python tools/create_demo_pdf.py
      - run: node tools/test_preview_ui.cjs
      - run: python tools/create_multiline_demo_pdf.py
      - run: node tools/test_multiline_ui.cjs
      - run: node tools/test_proof_ui.cjs

  windows-installer:
    name: Windows installer build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Run Python tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Build installer
        shell: pwsh
        run: |
          $env:PATH += ';C:\Program Files (x86)\NSIS'
          ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BankLens-Windows-installer
          path: packaging/windows/BankLens-Setup.exe
          if-no-files-found: error
